name: GitPush • Extensiontuik

on:
  workflow_dispatch:

concurrency:
  group: gitpush-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITPUSH_APP_NAME: "Extensiontuik"
      GITPUSH_SPLASH: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Detect lockfile
        id: lock
        run: |
          if [ -f package-lock.json ]; then echo "has_lock=true" >> $GITHUB_OUTPUT; else echo "has_lock=false" >> $GITHUB_OUTPUT; fi

      - name: Setup Node (npm cache)
        if: steps.lock.outputs.has_lock == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Node (no lockfile)
        if: steps.lock.outputs.has_lock != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules (fallback)
        if: steps.lock.outputs.has_lock != 'true'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ github.repository }}-nodemodules-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-nodemodules-
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ github.repository }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-gradle-
      - name: Install dependencies
        run: npm ci || npm install

      - name: Ensure native Android project
        run: |
          if [ ! -d android ]; then npx expo prebuild --platform android --no-install || npx react-native eject || true; fi
      - name: Inject Android permissions
        run: |
          MANIFEST=$(find . -path ./node_modules -prune -o -name AndroidManifest.xml -print | head -n 1)
          if [ -n "$MANIFEST" ]; then
            for PERM in INTERNET; do
              grep -q "android.permission.$PERM" "$MANIFEST" || \
                sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.$PERM\" \/>\n    <application/" "$MANIFEST"
            done
            echo "Permissions applied to $MANIFEST"
          else
            echo "No AndroidManifest.xml found — skipping permission injection"
          fi
      - name: Apply custom app icon
        run: |
          LOGO=$(ls gitpush/logo.* 2>/dev/null | head -n 1)
          if [ -n "$LOGO" ]; then
            for D in android/app/src/main/res/mipmap-*; do
              [ -d "$D" ] && cp "$LOGO" "$D/ic_launcher.png" && cp "$LOGO" "$D/ic_launcher_round.png"
            done
          fi
      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --build-cache --no-daemon
      - name: Rename output
        run: |
          mkdir -p gitpush-out
          FILE=$(ls -1 android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then echo "No build output matched android/app/build/outputs/apk/release/*.apk" && exit 1; fi
          cp "$FILE" "gitpush-out/tuik.apk"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Extensiontuik-gitpush
          path: gitpush-out/tuik.apk
          if-no-files-found: error
